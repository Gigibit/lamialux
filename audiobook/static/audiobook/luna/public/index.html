<body class="audio-unmuted">
  <canvas id="theia-canvas"></canvas>
  <h1 id="title">Luna</h1>
  <video id="luna"  autoplay playsinline muted></video>

  <!-- Contenitore per il bottone -->
<a id="donate-button" href="https://www.paypal.me/gigibit" target="_blank" style="text-decoration:none;">
  <div class="button paypal-button" onmouseover="this.style.transform='scale(1.05)';" onmouseout="this.style.transform='scale(1)';">
    Dona
  </div>
</a>
<div id="theia-form">
<svg viewBox="0 50 300 300" xmlns="http://www.w3.org/2000/svg" id="theia-form-deeper">
    <defs>
      <linearGradient id="blondeGradient" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#fffacd" />
        <stop offset="50%" stop-color="#fff" />
        <stop offset="100%" stop-color="#fffacd" />
      </linearGradient>
      <radialGradient id="eyeGradient" cx="50%" cy="50%" r="50%" gradientTransform="rotate(0)">
        <stop offset="0%" stop-color="#6b4f2c" />
        <stop offset="70%" stop-color="#4ca64c">
          <animate attributeName="stop-color" values="#4ca64c; #66ff66; #1db954; #4ca64c" dur="6s"
            repeatCount="indefinite" />
        </stop>
        <stop offset="100%" stop-color="#3b2f1b" />
        <animateTransform attributeName="gradientTransform" type="rotate" from="0 0.5 0.5" to="360 0.5 0.5" dur="12s"
          repeatCount="indefinite" />
      </radialGradient>
    </defs>
    <!-- capelli biondi ridimensionati e più coerenti con la testa -->
    <path d="M90 160 
         Q100 60, 150 50 
         Q200 60, 210 160 
         Q205 250, 150 300 
         Q95 250, 90 160 Z" fill="url(#blondeGradient)" class="stroke" />

    <!-- gruppo viso animabile -->
    <!-- gruppo viso animabile -->
    <g id="faceGroup">
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-0.5; 0,0; 0,-3; 0,0" dur="8s"
        repeatCount="indefinite" additive="sum" />

      <!-- testa -->
      <ellipse cx="150" cy="155" rx="50" ry="80" fill="#ffdcb0" stroke="#000" stroke-width="1" />

      <!-- CLIP PATH occhi -->
      <defs>
        <clipPath id="leftEyeClip">
          <path d="M113 145 Q125 138 137 145 Q125 152 113 145 Z" />
        </clipPath>
        <clipPath id="rightEyeClip">
          <path d="M163 145 Q175 138 187 145 Q175 152 163 145 Z" />
        </clipPath>
      </defs>

      <!-- OCCHIO SINISTRO -->
      <g clip-path="url(#leftEyeClip)">
        <ellipse cx="125" cy="145" rx="12" ry="7.5" fill="#fff" />
        <ellipse id="leftEye" cx="125" cy="145" rx="7" ry="5" fill="url(#eyeGradient)" />
        <circle cx="125" cy="145" r="2.2" fill="#000" />
        <circle cx="123.8" cy="143.8" r="1.4" fill="#fff" class="pupil-white" />
        <animate attributeName="d" dur="6s" repeatCount="indefinite" values="
               M113 145 Q125 138 137 145 Q125 152 113 145 Z; 
               M113 145 Q125 145 137 145 Q125 145 113 145 Z;
               M113 145 Q125 138 137 145 Q125 152 113 145 Z" keyTimes="0;0.08;0.16;1" calcMode="spline"
          keySplines="0.42 0 0.58 1;0.42 0 0.58 1;0.42 0 0.58 1" />
      </g>
      <!-- contorno palpebra -->
      <path d="M113 145 Q125 138 137 145" fill="none" stroke="#3b1a0d" stroke-width="1.6" />
      <path d="M113 146 Q125 152 137 146" fill="none" stroke="#c68c5a" stroke-width="1" opacity="0.6" />

      <!-- OCCHIO DESTRO -->
      <g clip-path="url(#rightEyeClip)">
        <ellipse cx="175" cy="145" rx="12" ry="7.5" fill="#fff" />
        <ellipse id="rightEye" cx="175" cy="145" rx="7" ry="5" fill="url(#eyeGradient)" />
        <circle cx="175" cy="145" r="2.2" fill="#000" />
        <circle cx="173.8" cy="143.8" r="1.4" fill="#fff" class="pupil-white" />
      </g>
      <!-- contorno palpebra -->
      <path d="M163 145 Q175 138 187 145" fill="none" stroke="#3b1a0d" stroke-width="1.6" />
      <path d="M163 146 Q175 152 187 146" fill="none" stroke="#c68c5a" stroke-width="1" opacity="0.6" />

      <!-- sopracciglia -->
      <path id="leftBrow" d="M115 132 Q125 124, 135 132" stroke="#3b1a0d" stroke-width="2" fill="none" />
      <path id="rightBrow" d="M165 132 Q175 124, 185 132" stroke="#3b1a0d" stroke-width="2" fill="none" />

      <!-- naso -->
      <path id="nose" d="M150 150 Q150 160, 148 165" stroke="#c68c5a" stroke-width="2" fill="none" />

      <!-- bocca (quella tua) -->
      <path id="mouthUpper" fill="#e38a72" stroke="#c04a30" stroke-width="3" />
      <path id="mouthLower" fill="#e38a72" stroke="#c04a30" stroke-width="3" />
      <path id="mouthInside" fill="#a12c2c" />
    </g>



    <!-- capelli principali coerenti e stilizzati -->
    <!-- capelli principali coerenti e stilizzati -->
    <g id="hair">
      <!-- ciocche superiori rialzate -->
      <path d="M95 150 
           Q125 40, 150 50 
           Q175 45, 205 150 
           Q120 90, 150 110
           Q110 120, 95 150 Z" fill="url(#blondeGradient)" class="stroke" />

      <!-- ciocche frontali/ciuffo rialzato -->
      <path d="M130 75 Q150 45, 170 75" fill="url(#blondeGradient)" class="stroke" />
      <path d="M120 85 Q150 50, 180 85" fill="url(#blondeGradient)" class="stroke" />
      <path d="M140 80 Q150 55, 160 80" fill="url(#blondeGradient)" class="stroke" />
    </g>

  </svg>
</div>
<a id="external-link" target="_blank" style="text-decoration:none; display: none;">
  <div style="
    left: 5px;
    width: 88vw;
    height: 40vh;
    border-radius: 16px;
    transform: scale(1);
    right: 5px;
    margin: 0 auto;
    " class="button wake-up" onmouseover="this.style.transform='scale(1.05)';" onmouseout="this.style.transform='scale(1)';">Apri fuori da Instagram/LinkedIn.</div>
</a>

<a target="_blank" style="text-decoration:none;">
  <div class="button wake-up" onmouseover="this.style.transform='scale(1.05)';" onmouseout="this.style.transform='scale(1)';"></div>
</a>
<div id="interaction-buttons">
        <button id="luna-body-btn" class="toggle-btn" title="Luna body Icon">
            <!-- Icona Omino (visibile di default) -->
            <svg class="icon-unbarred p-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor">
                <circle cx="12" cy="6" r="3" />
                <path d="M12 9v6M8 12h8M12 15l-3 5M12 15l3 5" />
            </svg>
            <!-- Icona Omino Sbarrato (nascosta di default) -->
            <svg class="icon-barred p-2" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke="currentColor">
                <circle cx="12" cy="6" r="3" />
                <path d="M12 9v6M8 12h8M12 15l-3 5M12 15l3 5" />
                <path d="M4 4l16 16" />
            </svg>
        </button>
         <!-- NUOVO: Bottone Mute/Unmute -->
        <button id="mute-btn" title="Toggle Mute">
            <!-- Icona per RIATTIVARE audio (nascosta di default) -->
            <svg class="icon-unmuted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
            </svg>
            <!-- Icona per MUTARE audio (visibile di default) -->
            <svg class="icon-muted" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" d="M17.25 9.75L19.5 12m0 0l2.25 2.25M19.5 12l2.25-2.25M19.5 12l-2.25 2.25m-10.5-6l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z" />
            </svg>
        </button>

        <button id="fullscreen-btn" title="Toggle Fullscreen">
            <!-- Icona per ENTRARE in fullscreen (visibile di default) -->
            <svg class="icon-enter-fullscreen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M3.75 3.75v4.5m0-4.5h4.5m-4.5 0L9 9M20.25 20.25v-4.5m0 4.5h-4.5m4.5 0L15 15m-6 0L3.75 20.25m16.5-16.5L15 9" />
            </svg>
            <!-- Icona per USCIRE da fullscreen (nascosta di default) -->
            <svg class="icon-exit-fullscreen" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"
                stroke-width="2" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round"
                    d="M9 9L3.75 3.75M3.75 3.75h4.5m-4.5 0v4.5m12 6L20.25 20.25m0 0v-4.5m0 4.5h-4.5" />
            </svg>
        </button>
    </div>
<div id="theia-form-container"></div>
